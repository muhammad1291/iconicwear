<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — ICONICWEAR</title>
  <meta name="description" content="Get in touch with ICONICWEAR for questions, collaborations or general enquiries.">
  <meta property="og:title" content="Contact — ICONICWEAR">
  <meta property="og:description" content="Get in touch with ICONICWEAR for questions, collaborations or general enquiries.">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/images/icons/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/images/icons/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="site-nav" id="site-nav"></nav>

  <main>
    <header class="page-header container">
      <p class="eyebrow reveal is-visible" style="margin-bottom:18px;">Get in touch</p>
      <h1 class="display reveal is-visible" id="contact-heading"></h1>
      <p class="lede reveal is-visible" id="contact-sub" style="margin-top:20px;"></p>
    </header>

    <section class="section-tight">
      <div class="container two-col">
        <div class="reveal">
          <form class="contact-form" id="contact-form">
            <div class="form-row">
              <div class="form-field">
                <label for="cf-name">Your name</label>
                <input type="text" id="cf-name" name="name" required autocomplete="name">
              </div>
              <div class="form-field">
                <label for="cf-email">Your email</label>
                <input type="email" id="cf-email" name="email" required autocomplete="email">
              </div>
            </div>
            <div class="form-field">
              <label for="cf-subject">Subject</label>
              <input type="text" id="cf-subject" name="subject" required>
            </div>
            <div class="form-field">
              <label for="cf-message">Tell us more</label>
              <textarea id="cf-message" name="message" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Send message</button>
            <p class="form-note" id="contact-form-note"></p>
          </form>
        </div>

        <div class="reveal">
          <div class="contact-actions">
            <a href="#" id="email-btn" class="btn btn-outline">Email ICONICWEAR</a>
          </div>

          <div class="social-row" style="margin-top:40px;">
            <p class="eyebrow" style="margin-bottom:4px;">Follow along</p>
            <a href="#" id="ig-goodsifyco" class="social-link" target="_blank" rel="noopener">
              <span>Instagram — GoodsifyCo</span>
              <span class="social-handle" id="ig-goodsifyco-handle"></span>
            </a>
            <a href="#" id="ig-iconicwear" class="social-link" target="_blank" rel="noopener">
              <span>Instagram — ICONICWEAR</span>
              <span class="social-handle" id="ig-iconicwear-handle"></span>
            </a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/content.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("contact-heading").textContent = CONTENT.contact.heading;
      document.getElementById("contact-sub").textContent = CONTENT.contact.supporting;
      document.getElementById("contact-form-note").textContent = CONTENT.contact.formNote;
      document.getElementById("email-btn").href = `mailto:${CONTENT.contact.email}`;
      document.getElementById("email-btn").innerHTML = `<span class="btn-icon">${ICONS.mail}</span> Email ICONICWEAR`;

      document.getElementById("ig-goodsifyco").href = CONTENT.social.goodsifyco.url;
      document.getElementById("ig-goodsifyco-handle").textContent = CONTENT.social.goodsifyco.handle;
      document.getElementById("ig-iconicwear").href = CONTENT.social.iconicwear.url;
      document.getElementById("ig-iconicwear-handle").textContent = CONTENT.social.iconicwear.handle;

      const form = document.getElementById("contact-form");
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const name = document.getElementById("cf-name").value;
        const email = document.getElementById("cf-email").value;
        const subject = document.getElementById("cf-subject").value;
        const message = document.getElementById("cf-message").value;

        const body = `Name: ${name}\nEmail: ${email}\n\n${message}`;
        const mailto = `mailto:${CONTENT.contact.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        window.location.href = mailto;
      });
    });
  </script>
</body>
</html>
