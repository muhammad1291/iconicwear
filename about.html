<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About — ICONICWEAR</title>
  <meta name="description" content="The story behind ICONICWEAR — a Pakistan-focused streetwear brand built from the ground up.">
  <meta property="og:title" content="About — ICONICWEAR">
  <meta property="og:description" content="The story behind ICONICWEAR — a Pakistan-focused streetwear brand built from the ground up.">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/images/icons/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/images/icons/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="site-nav" id="site-nav"></nav>

  <main>
    <header class="page-header container">
      <p class="eyebrow reveal is-visible" style="margin-bottom:18px;">Our story</p>
      <h1 class="display reveal is-visible" id="about-heading"></h1>
    </header>

    <section class="section-tight">
      <div class="container">
        <div class="prose reveal" id="about-intro"></div>
        <div class="about-image reveal" id="about-image"></div>
      </div>
    </section>

    <section class="section section-charcoal section-border-top">
      <div class="container">
        <div class="section-head reveal">
          <h2 class="display section-heading" id="journey-heading" style="font-size:clamp(2rem,4vw,3.2rem);"></h2>
        </div>
        <div class="timeline reveal" id="journey-timeline"></div>
      </div>
    </section>

    <section class="section section-border-top">
      <div class="container">
        <div class="section-head reveal" style="margin-bottom:36px;">
          <h2 class="display section-heading" id="founder-heading" style="font-size:clamp(2rem,4vw,3rem);"></h2>
        </div>
        <div class="founder-editorial reveal">
          <div class="founder-photo" id="founder-photo"></div>
          <div class="prose" id="founder-body"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/content.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const about = CONTENT.about;

      document.getElementById("about-heading").textContent = about.heading;
      document.getElementById("about-intro").innerHTML = about.intro.map(p => `<p>${p}</p>`).join("");

      const imgMount = document.getElementById("about-image");
      const imgWrap = buildImage(about.image, "ICONICWEAR", null);
      imgWrap.querySelectorAll("img, .placeholder").forEach(el => {
        el.style.width = "100%";
        el.style.height = "100%";
      });
      while (imgWrap.firstChild) imgMount.appendChild(imgWrap.firstChild);

      // Our journey timeline
      document.getElementById("journey-heading").textContent = about.journeyHeading;
      document.getElementById("journey-timeline").innerHTML = about.journey.map(item => `
        <div class="timeline-item${item.planned ? " is-planned" : ""}">
          <div class="timeline-year">${item.year || "—"}</div>
          <div class="timeline-body">
            <h3>${item.title}${item.planned ? '<span class="planned-tag">Planned</span>' : ""}</h3>
            <p>${item.body}</p>
          </div>
        </div>
      `).join("");

      // Founder — editorial layout with real photo
      document.getElementById("founder-heading").textContent = about.founder.heading;
      document.getElementById("founder-body").innerHTML = about.founder.body.map(p => `<p>${p}</p>`).join("");

      const founderMount = document.getElementById("founder-photo");
      const founderImg = buildImage(about.founder.photo, "The person behind ICONICWEAR", null);
      founderImg.querySelectorAll("img, .placeholder").forEach(el => {
        el.style.width = "100%";
        el.style.height = "100%";
      });
      while (founderImg.firstChild) founderMount.appendChild(founderImg.firstChild);

      initScrollReveal();
    });
  </script>
</body>
</html>
