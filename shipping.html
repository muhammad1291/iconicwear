<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shipping — ICONICWEAR</title>
  <meta name="description" content="Shipping information for ICONICWEAR orders within Pakistan.">
  <meta property="og:title" content="Shipping — ICONICWEAR">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/images/icons/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="site-nav" id="site-nav"></nav>

  <main>
    <header class="page-header container">
      <p class="eyebrow reveal is-visible" style="margin-bottom:18px;">Delivery</p>
      <h1 class="display reveal is-visible" id="shipping-heading"></h1>
      <p class="lede reveal is-visible" id="shipping-intro" style="margin-top:20px;"></p>
    </header>

    <section class="section-tight">
      <div class="container" style="max-width:760px;">
        <span class="policy-note" id="shipping-note"></span>
        <div class="policy-list" id="shipping-list"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/content.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const s = CONTENT.shipping;
      document.getElementById("shipping-heading").textContent = s.heading;
      document.getElementById("shipping-intro").textContent = s.intro;
      document.getElementById("shipping-note").textContent = s.note;
      document.getElementById("shipping-list").innerHTML = s.sections
        .map(sec => `<div class="policy-item"><h3>${sec.title}</h3><p>${sec.body}</p></div>`)
        .join("");
    });
  </script>
</body>
</html>
